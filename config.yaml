# Kuku Promo Finder configuration. No secrets here: keys come from the env var named in api_key_env.
# Every LLM stage picks its own model (D-005). Override from the CLI with --model / --proposer-model /
# --judge-model / --api-base / --api-key-env (e.g. Kuku's OpenAI-compatible endpoint: model "openai/<name>").

models:
  # D-029 (accepted 2026-11-07): Gemini's free tier is 20 requests/day/model, too few for a 50-episode run,
  # so all three stages run on Groq (1000 requests/day and 8000 tokens/minute PER MODEL, read from Groq's
  # response headers on 2026-11-07). Proposer/arc and judge are different families (OpenAI vs Qwen, D-006).
  # Groq counts actual prompt + completion tokens against the 8k/min, not max_tokens (D-030).
  proposer:
    model: groq/openai/gpt-oss-120b
    api_base: null
    api_key_env: GROQ_API_KEY
    temperature: 0
    max_tokens: 4000     # D-030: reasoning alone used 2,994 tokens on one episode; Groq doesn't reserve max_tokens
    # Hidden "thinking" budget: minimal | low | medium | high, or null for the provider default.
    # LiteLLM maps it per provider (Gemini 3: thinkingLevel; gpt-oss takes it as is). Rejected → retried
    # without it. null = provider default (D-027: "low" gave too-short picks on real episodes).
    reasoning_effort: null
  arc:
    model: groq/openai/gpt-oss-120b
    api_base: null
    api_key_env: GROQ_API_KEY
    temperature: 0
    max_tokens: 3000
    reasoning_effort: null
  judge:
    # Different model family from the proposer, to reduce self-preference bias (D-006).
    model: groq/qwen/qwen3.8-27b
    api_base: null
    api_key_env: GROQ_API_KEY
    temperature: 0
    max_tokens: 3000
    reasoning_effort: null

# What the proposer reads (D-031): CAMERA shot text cut to this many characters (null = full text).
# Saves input tokens under Groq's 8k tokens/minute limit; dialogue, action and SFX lines are never cut.
proposer_input:
  camera_max_chars: 70

concurrency: 1           # parallel LLM calls per stage; 1 because one call is ~half of Groq's 8k tokens/minute
rate_limit:
  rpm: 10                # client-side cap per stage; free tiers throttle hard
retries:
  max_attempts: 5        # on 429 / 5xx, exponential backoff
  backoff_base_s: 2       # used only when the provider gives no wait hint
  max_wait_s: 120         # a 429 asking to wait longer than this (a daily quota) fails at once (D-030)
  json_repair_attempts: 1  # on invalid JSON: retry once with the validation error appended

cache_dir: .cache/llm

# USD per 1M tokens, for the cost table in the manifest. Free-tier models are $0.
# reference_paid: what the same token counts would cost on a paid model, for the scale estimate.
# Fill these from the providers' pricing pages when writing the cost section; never guess (CLAUDE.md rule 4).
prices:
  gemini/gemini-3.5-flash: {input: 0, output: 0}
  groq/openai/gpt-oss-120b: {input: 0, output: 0}
  groq/qwen/qwen3.8-27b: {input: 0, output: 0}
  reference_paid: {model: null, input: null, output: null}

build:
  hook_max_offset_s: 3.0     # hook must start within this many seconds of the clip start
  lead_in_target_s: 1.0      # preferred gap between clip start and hook
  lead_in_window_s: 2.5      # look for a shot start this far before the hook
  min_duration_s: 20.0
  max_duration_s: 60.0
  jumpcut_target_max_s: 55.0
  jumpcut_s1_min_s: 12.0
  jumpcut_s1_max_s: 25.0
  extend_max_s: 8.0          # max forward extension for too-short clips
  dedupe_iou: 0.5
  arc_min_segment_s: 4.0
  arc_seg1_min_s: 8.0        # arc opening part: at least this long, so the hook has room to land

rank:
  weights: {hook: 0.35, cliff: 0.30, standalone: 0.20, trope_pull: 0.10, pacing: 0.05}
  bonus: {early_ep_max: 5, early_ep: 0.06, mid_ep_max: 15, mid_ep: 0.03, sweet_spot: [30, 45], sweet_spot_bonus: 0.03, arc: 0.02}
  penalty: {midshot_start: 0.03, midshot_end: 0.03, needs_context: 0.05, cliff_may_resolve: 0.05}
  diversity: {top_n: 20, max_per_episode: 2, top_scene_n: 10, max_per_scene: 1}
  llm_rationale: false

judge:
  batch_size: 3            # clips per judge call; ~3 full excerpts keep one call under Groq's 8k tokens/minute

arcs:
  enabled: true            # one extra LLM call pairing single-episode clips across episodes (D-039)
